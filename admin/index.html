<script>
// Sveltia lowercases a new entry's address last, in the browser's language, so in a
// Turkish browser "International" became "ınternational". Addresses are plain ASCII
// by then, so ASCII text is lowercased as English; other text (search) is unchanged.
(() => {
  const lower = String.prototype.toLocaleLowerCase;
  String.prototype.toLocaleLowerCase = function (locales) {
    return lower.call(this, locales ?? (/^[\x00-\x7f]*$/.test(this) ? "en" : undefined));
  };
})();
</script>
