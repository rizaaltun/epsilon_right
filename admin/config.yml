  - name: catalogues
    label: Kataloglar
    label_singular: Katalog
    description: PDF yükleyin; sayfa sayfa okuyucu ve kapak görseli yayına alınırken otomatik üretilir. Sıra "Yeniden sırala" ile değişir.
    icon: auto_stories
    folder: _src/content/catalogues
    extension: json
    format: json
    create: true
    delete: true
    reorder: true
    identifier_field: title
    slug:
      template: "{{title}}"
      editable: [create]
      hint: Kataloğun adresi, örn. /catalogues/adult-titles-2026/. Kayıttan sonra değiştirilemez.
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnızca küçük harf (Türkçe karakter yok), rakam ve tire kullanın.']
    summary: "{{title}}"
    thumbnail: cover
    preview_path: catalogues/{{slug}}/
    media_folder: /assets/catalogues
    public_folder: /assets/catalogues
    fields:
      - { name: title, label: Katalog adı, widget: string }
      - { name: category, label: Tür, widget: string, hint: "Örn. Adult, Children's, Young Adult" }
      - { name: year, label: Yıl, widget: string, default: "2026" }
      - name: description
        label: Açıklama
        widget: markdown
        required: false
        buttons: [bold, italic, link]
        editor_components: []
      - name: pdf
        label: PDF dosyası
        widget: file
        accept: application/pdf
        choose_url: false
        hint: Yeni PDF yüklendiğinde okuyucu sayfaları yayına alınırken yeniden üretilir (birkaç dakika sürebilir).
        media_libraries:
          default:
            config:
              max_file_size: 40000000
      - name: cover
        label: Kapak görseli
        widget: image
        required: false
        choose_url: false
        media_folder: /assets/images/uploads/catalogues
        public_folder: /assets/images/uploads/catalogues
        hint: Boş bırakılırsa PDF'in ilk sayfasından otomatik üretilir.
      - { name: new, label: '"New" etiketi', widget: boolean, default: false }
      - { name: seo_title, label: "SEO başlığı", widget: string, required: false, hint: "Google'da ve sekme başlığında görünür (en fazla ~60 karakter). Boşsa ad + site adı kullanılır." }
      - { name: seo_description, label: "SEO açıklaması", widget: text, required: false, hint: "Google'da başlığın altında ve paylaşım önizlemelerinde görünen 1–2 cümle (en fazla ~155 karakter). Boşsa metinden otomatik oluşturulur." }

