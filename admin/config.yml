        display_fields: ["{{title}} — {{author}}"]
        search_fields: [title, author]
        multiple: true
        required: false
        hint: Yazının altında kitap kartları olarak listelenir ve kitap sayfalarına link verir.
      - name: gallery
        label: Galeri
        widget: list
        required: false
        fields:
          - { name: image, label: Görsel, widget: image, choose_url: false }
