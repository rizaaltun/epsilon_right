# Admin panel (Sveltia CMS) configuration. See _src/ADMIN.md.
#
# The panel edits the JSON files under _src/content/ and commits them to main.
# The "Build site" workflow then regenerates the pages from that content.

backend:
  name: github
  repo: rizaaltun/epsilon_right
  branch: main
  # OAuth sign-in goes through the Sveltia CMS Authenticator worker; set its URL
  # here once it is deployed (see _src/ADMIN.md). Until then, collaborators can
  # sign in with a GitHub personal access token.
  # base_url: https://epsilon-cms-auth.<account>.workers.dev
  commit_messages:
    create: "İçerik eklendi: {{collection}} / {{slug}}"
    update: "İçerik güncellendi: {{collection}} / {{slug}}"
    delete: "İçerik silindi: {{collection}} / {{slug}}"
    uploadMedia: "Görsel yüklendi: {{path}}"
    deleteMedia: "Görsel silindi: {{path}}"

app_title: Epsilon Publishing Group — Yönetim
site_url: https://epsilonpublishinggroup.com

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

media_libraries:
  default:
    config:
      max_file_size: 10000000
      slugify_filename: true
      # Uploaded photos are converted to WebP in the browser before upload;
      # the site build then makes the 480px/1000px cover variants.
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 1600

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: books
    label: Kitaplar
    label_singular: Kitap
    description: Sitedeki her kitap. Sıralamayı değiştirmek için listede "Yeniden sırala"yı kullanın.
    icon: menu_book
    folder: _src/content/books
    extension: json
    format: json
    create: true
    delete: true
    reorder: true
    identifier_field: title
    slug:
      template: "{{title}}"
      editable: [create]
      hint: Kitabın adresi, örn. /books/eflatun-koza/. Kayıttan sonra değiştirilemez.
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnızca küçük harf (Türkçe karakter yok), rakam ve tire kullanın.']
    summary: "{{title}} — {{author}}"
    sortable_fields: [title, author, publication_year]
    thumbnail: cover
    preview_path: books/{{slug}}/
    media_folder: /assets/images/uploads/covers
    public_folder: /assets/images/uploads/covers
    view_filters:
      - { label: "Children's Books", field: category, eq: childrens-books }
      - { label: Adult Fiction, field: category, eq: adult-fiction }
      - { label: Non-Fiction, field: category, eq: non-fiction }
      - { label: Young Adult, field: category, eq: young-adult }
      - { label: Kapağı olmayanlar, field: cover, empty: true }
    view_groups:
      - { label: Kategori, field: category }
      - { label: Yayınevi, field: imprint }
    fields:
      - { name: title, label: Kitap adı, widget: string }
      - name: author
        label: Yazar
        widget: string
        hint: Yazarlar listesindeki adla aynı yazılırsa kitap, yazarın sayfasına bağlanır.
      - name: category
        label: Kategori
        widget: select
        options:
          - { label: "Children's Books", value: childrens-books }
          - { label: Adult Fiction, value: adult-fiction }
          - { label: Non-Fiction, value: non-fiction }
          - { label: Young Adult, value: young-adult }
      - name: catalogue
        label: Katalog
        widget: select
        hint: Kitap sayfasındaki "Read catalogue" düğmesi ve katalog sayfasındaki listesi için.
        options:
          - { label: "Children's Titles 2026", value: childrens-titles-2026 }
          - { label: Adult Titles 2026, value: adult-titles-2026 }
          - { label: Young Adult Titles 2026, value: young-adult-titles-2026 }
      - name: cover
        label: Kapak
        widget: image
        required: false
        choose_url: false
        hint: JPG, PNG veya WebP. Site için küçük ve büyük boyutları otomatik üretilir.
      - { name: square_cover, label: Kare kapak, widget: boolean, default: false, hint: Kare formatlı (çoğunlukla resimli çocuk kitapları) kapaklar için açın. }
      - name: description
        label: Tanıtım metni
        widget: text
        required: false
        hint: İngilizce. Paragrafları boş bir satırla ayırın.
      - { name: original_title, label: Orijinal adı, widget: string, required: false }
      - { name: original_language, label: Orijinal dili, widget: string, required: false, default: Turkish }
      - { name: english_title, label: İngilizce adı, widget: string, required: false }
      - name: imprint
        label: Yayınevi
        widget: select
        required: false
        hint: Kitap, seçilen yayınevinin sayfasında listelenir.
        options: [Epsilon, Kafka, Masalperest, Nemesis, Okuyan Us, Uçan Fil, Okuyan Koala]
      - { name: pages, label: Sayfa sayısı, widget: string, required: false }
      - { name: publication_year, label: Yayın yılı, widget: string, required: false, hint: Örn. 2024 ya da 2024-2025 }
      - { name: illustrator, label: Resimleyen, widget: string, required: false }
      - { name: age_group, label: Yaş grubu, widget: string, required: false, hint: Örn. 6+ }
      - name: rights
        label: Haklar
        widget: text
        default: Rights are available worldwide
        hint: Kitap sayfasındaki "Rights" kutusunda görünür.
      - name: rights_sold
        label: Hakları satılan diller
        widget: list
        required: false
        hint: Kitaplar sayfasındaki dil filtresinde kullanılır.
      - { name: featured, label: Öne çıkan, widget: boolean, default: false }
      - { name: new, label: Yeni, widget: boolean, default: false }

  - name: authors
    label: Yazarlar
    label_singular: Yazar
    icon: person
    folder: _src/content/authors
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug:
      template: "{{name}}"
      editable: [create]
      hint: Yazarın adresi, örn. /authors/cahide-birgul/. Kayıttan sonra değiştirilemez.
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnızca küçük harf (Türkçe karakter yok), rakam ve tire kullanın.']
    summary: "{{name}}"
    preview_path: authors/{{slug}}/
    fields:
      - name: name
        label: Ad soyad
        widget: string
        hint: Kitaplardaki "Yazar" alanı bu adla eşleşir.
      - name: bio
        label: Biyografi
        widget: text
        required: false
        hint: İngilizce. Paragrafları boş bir satırla ayırın.
      - { name: featured, label: Öne çıkan, widget: boolean, default: false }

  - name: news
    label: Haberler
    label_singular: Haber
    description: Haberler sayfası ve ana sayfadaki "From the desk" bölümü, en yeni haber önde olacak şekilde otomatik dolar.
    icon: newspaper
    folder: _src/content/news
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug:
      template: "{{title}}"
      editable: [create]
      hint: Haberin adresi, örn. /news/frankfurt-book-fair-2026-return/. Kayıttan sonra değiştirilemez.
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnızca küçük harf (Türkçe karakter yok), rakam ve tire kullanın.']
    summary: "{{pinned | ternary('📌 ', '')}}{{date}} — {{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    thumbnail: image
    preview_path: news/{{slug}}/
    media_folder: /assets/images/uploads/news
    public_folder: /assets/images/uploads/news
    fields:
      - { name: title, label: Başlık, widget: string }
      - { name: date, label: Tarih, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - name: category
        label: Tür
        widget: select
        default: Announcements
        options: [Announcements, Industry, Press, Fairs, Rights deals, Awards]
      - { name: pinned, label: Vitrine sabitle, widget: boolean, default: false, hint: Açıksa haber, ana sayfada ve haberler sayfasında yeni haberlerin önünde kalır. }
      - { name: byline, label: İmza, widget: string, default: Editorial desk, hint: 'Tarihin yanında görünür, örn. "Editorial desk".' }
      - { name: excerpt, label: Özet, widget: text, hint: Haber kartlarında görünen kısa metin (1–2 cümle). }
      - { name: image, label: Görsel, widget: image, required: false, choose_url: false }
      - { name: image_alt, label: Görsel açıklaması, widget: string, required: false, hint: Görme engelliler ve Google için. Boş bırakılırsa başlık kullanılır. }
      - name: image_ratio
        label: Haber sayfasındaki görsel oranı
        widget: select
        default: 3/2
        options:
          - { label: Yatay (3:2), value: 3/2 }
          - { label: Geniş (16:9), value: 16/9 }
          - { label: Dikey (4:5), value: 4/5 }
          - { label: Kare (1:1), value: 1/1 }
      - { name: show_image, label: Görseli haber sayfasında göster, widget: boolean, default: true, hint: Kapalıysa görsel yalnızca haber kartlarında kullanılır. }
      - name: body
        label: Metin
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []
      - name: gallery
        label: Galeri
        widget: list
        required: false
        fields:
          - { name: image, label: Görsel, widget: image, choose_url: false }
          - { name: alt, label: Açıklama, widget: string, required: false }
      - { name: source, label: Kaynak notu, widget: string, required: false, hint: Haberin altında küçük yazıyla görünür. }

  - name: events
    label: Fuarlar & Etkinlikler
    label_singular: Etkinlik
    description: Bitiş tarihi geçen etkinlikler kendiliğinden "Past" bölümüne geçer. Ana sayfadaki kart sıradaki etkinliği gösterir.
    icon: event
    folder: _src/content/events
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug:
      template: "{{title}}"
      editable: [create]
      hint: Etkinliğin adresi, örn. /fairs-events/frankfurter-buchmesse-2026/. Kayıttan sonra değiştirilemez.
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnızca küçük harf (Türkçe karakter yok), rakam ve tire kullanın.']
    summary: "{{pinned | ternary('📌 ', '')}}{{start_date}} — {{title}}"
    sortable_fields:
      fields: [start_date, title]
      default: { field: start_date, direction: descending }
    thumbnail: image
    preview_path: fairs-events/{{slug}}/
    media_folder: /assets/images/uploads/events
    public_folder: /assets/images/uploads/events
    fields:
      - { name: title, label: Etkinlik adı, widget: string }
      - { name: start_date, label: Başlangıç tarihi, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: pinned, label: Ana sayfada sabitle, widget: boolean, default: false, hint: Açıksa ana sayfadaki fuar kartı, tarihi geçmiş olsa bile bu etkinliği gösterir. }
      - { name: end_date, label: Bitiş tarihi, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: Tek günlük etkinlikte boş bırakın. }
      - { name: venue, label: Mekân, widget: string, required: false, hint: Örn. Messe Frankfurt }
      - { name: city, label: Şehir, widget: string, required: false }
      - { name: country, label: Ülke, widget: string, required: false, hint: İngilizce, örn. Germany }
      - { name: stand, label: Stant, widget: string, required: false, hint: Örn. Hall 5.1 · C20 }
      - { name: summary, label: Kısa açıklama, widget: string, required: false, hint: Etkinlik listesinde görünür. }
      - name: body
        label: Metin
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []
      - { name: website, label: Resmî site, widget: string, required: false, hint: "https:// ile başlayan adres" }
      - { name: image, label: Görsel, widget: image, required: false, choose_url: false }
      - { name: image_alt, label: Görsel açıklaması, widget: string, required: false }
      - name: gallery
        label: Galeri
        widget: list
        required: false
        fields:
          - { name: image, label: Görsel, widget: image, choose_url: false }
          - { name: alt, label: Açıklama, widget: string, required: false }

singletons:
  - name: home
    label: Ana sayfa vitrinleri
    icon: home
    file: _src/content/settings/home.json
    format: json
    preview_path: ""
    fields:
      - name: fiction_highlights
        label: Fiction highlights
        widget: relation
        collection: books
        value_field: "{{slug}}"
        display_fields: ["{{title}} — {{author}}"]
        search_fields: [title, author]
        multiple: true
        min: 1
        hint: Sürükleyerek sıralayabilirsiniz.
      - name: non_fiction_highlights
        label: Non-fiction highlights
        widget: relation
        collection: books
        value_field: "{{slug}}"
        display_fields: ["{{title}} — {{author}}"]
        search_fields: [title, author]
        multiple: true
        min: 1
        hint: Sürükleyerek sıralayabilirsiniz.
      - name: for_younger_readers
        label: For younger readers
        widget: relation
        collection: books
        value_field: "{{slug}}"
        display_fields: ["{{title}} — {{author}}"]
        search_fields: [title, author]
        multiple: true
        min: 1
        hint: Sürükleyerek sıralayabilirsiniz.

  - name: site
    label: Site ayarları
    icon: settings
    file: _src/content/settings/site.json
    format: json
    fields:
      - { name: site_name, label: Site adı, widget: string, hint: Sayfa başlıklarının sonunda görünür. }
      - { name: tagline, label: Slogan, widget: string, hint: Alt bilgide (footer) görünür. }
      - { name: email, label: E-posta, widget: string, hint: Haklar talebi düğmeleri ve alt bilgi bu adresi kullanır. }
      - { name: location, label: Konum, widget: string }
      - { name: instagram, label: Instagram adresi, widget: string }
      - { name: linkedin, label: LinkedIn adresi, widget: string }
      - { name: copyright, label: Telif satırı, widget: string }
