      - { name: date, label: Tarih, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: author, label: Yazar, widget: string, required: false, hint: "Boşsa yazar olarak Epsilon Publishing Group görünür." }
      - { name: tags, label: Etiketler, widget: list, required: false, hint: "Örn. Translation rights, Children's books. İlki kartlarda görünür." }
      - { name: pinned, label: Vitrine sabitle, widget: boolean, default: false, hint: Açıksa yazı blog sayfasında yeni yazıların önünde kalır. }
      - { name: excerpt, label: Özet, widget: text, hint: "Kartlarda ve RSS'te görünen 1–2 cümle." }
      - { name: image, label: Kapak görseli, widget: image, required: false, choose_url: false }
      - { name: image_alt, label: Görsel açıklaması, widget: string, required: false }
      - name: image_ratio
        label: Görsel oranı
        widget: select
        default: "3/2"
        options:
          - { label: "Yatay (3:2)", value: "3/2" }
          - { label: "Geniş (16:9)", value: "16/9" }
          - { label: "Dikey (4:5)", value: "4/5" }
          - { label: "Kare (1:1)", value: "1/1" }
      - name: body
        label: Metin
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []
        hint: "Ara başlıklar (H2/H3) kullanın; kitaplara link verin. İngilizce."
      - name: books
        label: Yazıda geçen kitaplar
        widget: relation
        collection: books
