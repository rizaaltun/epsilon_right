name: Build site from content
# Runs after the admin panel (or anyone) commits content to _src/ on main:
# regenerates the pages, commits them and asks GitHub Pages to publish.
# It also runs every morning so fairs move from "Upcoming" to "Past" on time.
# The Pages source (main / root) and CNAME are not touched.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'   # 06:15 Istanbul
  push:
    branches: [main]
    paths:
      - '_src/**'
      - 'assets/images/uploads/**'
      - '.github/workflows/build-site.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: optimize-site-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Build pages from content
        run: python _src/build.py
      - name: Check the build is stable
        run: python _src/build.py --check
      - name: Save generated pages
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!_src'
          if ! git diff --cached --quiet; then
            git commit -m 'Build site from content'
            # The panel may have committed again while this ran; its own run
            # rebuilds after this one, so rebasing the generated files is safe.
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages build
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
