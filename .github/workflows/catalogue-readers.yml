name: Publish catalogue readers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/catalogue-upload/**'
      - 'scripts/build_catalogue_readers.py'
      - 'scripts/reader-assets/**'
      - '.github/workflows/catalogue-readers.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: optimize-site-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.26.6 Pillow==11.3.0
      - run: python scripts/build_catalogue_readers.py
      - run: node --check assets/flipbook.js
      - name: Save PDF catalogues and readers
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github assets books catalogues
          if ! git diff --cached --quiet; then
            git commit -m 'Publish fast black full-screen catalogue readers'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages build
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
